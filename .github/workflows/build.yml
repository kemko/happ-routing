name: Update geodata

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'sources.json'
      - 'happ-routing.json'
      - 'mihomo-rules.yaml'
      - 'scripts/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: publish-geodata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download MRS converter
        run: |
          curl --fail --location --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1-v1.19.33.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "8ec92e7b2fdc6b853ba00156bab7e4e965c8b0d843b8c4ac8ab98795f02ad524  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test builder
        run: |
          go test ./...
          python3 -m unittest discover -s scripts
      - name: Build databases and profile
        run: |
          go run .
          python3 scripts/profile.py
          bash scripts/mihomo.sh
          cp LICENSE NOTICE sources.json dist/
          cp happ-routing.json dist/routing-policy.json
          cp -R licenses dist/
          cp README.md dist/
          cd dist
          sha256sum geosite.dat geoip.dat happ-routing.json happ-import-link.txt manifest.json routing-policy.json mihomo-rules.yaml mihomo/*.txt mihomo/*.mrs > SHA256SUMS
      - name: Publish latest files to release branch
        run: |
          publish_dir="$RUNNER_TEMP/happ-routing-release"
          git fetch --no-tags --depth=1 origin refs/heads/release
          git worktree add --detach "$publish_dir" FETCH_HEAD
          git -C "$publish_dir" rm -r --ignore-unmatch .
          cp -a dist/. "$publish_dir/"
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Release files are unchanged"
            exit 0
          fi
          git -C "$publish_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update geodata $(date -u +%Y-%m-%d)"
          git -C "$publish_dir" push origin HEAD:refs/heads/release
